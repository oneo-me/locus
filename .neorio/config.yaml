icon: source/assets/icon.png
commands:
  - id: run
    command: GOWORK=off go tool mygo dev
    directory: source
  - id: build
    command: GOWORK=off go tool mygo build -platform darwin/arm64,darwin/amd64,windows/amd64,linux/amd64
    directory: source
menu:
  - id: website
    name: website
    command: bun install && bun run dev
    directory: site
