icon: source/assets/icon.png
tasks:
  - label: Run
    group: run
    command: go
    args: [tool, mygo, dev]
    options:
      cwd: source
      env:
        GOWORK: "off"
  - label: Build
    group: build
    command: go
    args:
      - tool
      - mygo
      - build
      - -platform
      - darwin/arm64,darwin/amd64,windows/amd64,windows/arm64,linux/amd64,linux/arm64
    options:
      cwd: source
      env:
        GOWORK: "off"
    outputDirectory: ../dist
  - label: website
    type: shell
    command: bun install && bun run dev
    options:
      cwd: website
