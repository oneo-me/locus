icon: source/assets/icon.png
commands:
  - id: run
    command: GOWORK=off go tool mygo dev
    directory: source
  - id: build
    command: GOWORK=off go tool mygo build -platform darwin/arm64,darwin/amd64,windows/amd64,linux/amd64
    directory: source
menu:
  - id: test
    name: Test
    command: GOWORK=off go test ./...
    directory: source
  - id: vet
    name: Vet
    command: GOWORK=off go vet ./...
    directory: source
  - id: site
    name: Site dev
    command: bun run dev
    directory: site
