[package]
name = "oneo-gpui"
version = "0.1.0"
edition = "2024"

[features]
default = ["shell"]
shell = ["dep:gpui-kit", "dep:objc2", "dep:objc2-app-kit", "dep:raw-window-handle"]

[[example]]
name = "minimal"
required-features = ["shell"]

[dependencies]
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
tempfile.workspace = true
toml.workspace = true
gpui-kit = { workspace = true, optional = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSColor",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
raw-window-handle = { version = "0.6", optional = true }
