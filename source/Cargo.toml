[workspace]
members = ["crates/*"]
default-members = ["crates/locus"]
resolver = "3"

[workspace.package]
license = "MIT"
version = "0.2026.1"
edition = "2024"

[workspace.dependencies]
gpui-kit = "0.7.0"

anyhow = "1"
base64 = "0.23"
sha2 = "0.11"
tempfile = "3"
toml = "1.1"
async-channel = "2.5"
axum = "0.8"
dirs = "6"
url = "2"
futures = "0.3"
oneo-gpui = { path = "crates/oneo-gpui" }
oneo-gpui-webview = { path = "crates/oneo-gpui-webview" }
oneo-gpui-terminal = { path = "crates/oneo-gpui-terminal" }
http_client = { package = "gpui-pre-http-client", version = "0.3.7" }
image = "0.25"
markdown = "1.0"
libc = "0.2"
notify = "8.2"
percent-encoding = "2"
pulldown-cmark = "0.13"
plist = "1.10"
regex = "1"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "0.3.7" }
rmcp = { version = "3.4", features = [
  "macros",
  "schemars",
  "server",
  "transport-streamable-http-server",
] }
rust-i18n = "4.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.1"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-segmentation = "1.12"
uuid = { version = "1", features = ["v4"] }

locus-canvas = { path = "crates/locus-canvas" }
locus-library = { path = "crates/locus-library" }
locus-preferences = { path = "crates/locus-preferences" }
locus-mcp = { path = "crates/locus-mcp" }
locus-ui = { path = "crates/locus-ui" }
locus-settings = { path = "crates/locus-settings" }
locus-workspace = { path = "crates/locus-workspace" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
