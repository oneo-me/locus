[package]
license.workspace = true
name = "oneo-gpui"
version = "0.1.0"
edition = "2024"

[features]
default = ["shell"]
shell = ["dep:gpui-kit", "dep:core-graphics", "dep:windows", "dep:objc2", "dep:objc2-app-kit", "dep:raw-window-handle", "dep:rust-i18n", "dep:sys-locale"]

[[example]]
name = "minimal"
required-features = ["shell"]

[dependencies]
rust-i18n = { workspace = true, optional = true }
sys-locale = { workspace = true, optional = true }
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
tempfile.workspace = true
toml.workspace = true
gpui-kit = { workspace = true, optional = true, features = ["profiler"] }

[dev-dependencies]
serde_json.workspace = true
serde-saphyr.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true, features = [
    "std",
    "NSAccessibility",
    "NSAppearance",
    "NSColor",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
raw-window-handle = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true, features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = { workspace = true, optional = true }
