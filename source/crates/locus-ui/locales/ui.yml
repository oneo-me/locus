_version: 2
common.ok:
  en: OK
  zh-CN: 好
common.file_action_error_detail:
  en: Check that the file still exists and that Locus has permission to access it.
  zh-CN: 请确认文件仍然存在，并且 Locus 有权访问它。
markdown.attachments.label_mismatch:
  en: "Link label must match the attachment name: %{name}"
  zh-CN: 链接文字必须使用附件文件名：%{name}
markdown.attachments.link_required:
  en: Include at least one attachment link.
  zh-CN: 请至少填写一个附件链接。
markdown.attachments.links_only:
  en: Attachment blocks can contain only attachment links.
  zh-CN: 附件块中只能包含附件链接。
markdown.attachments.local_links_only:
  en: Include only local attachment links from this note.
  zh-CN: 请只填写当前笔记的本地附件链接。
markdown.attachments.missing:
  en: "Attachment does not exist: %{target}"
  zh-CN: 附件不存在：%{target}
markdown.attachments.open_error:
  en: Could not open attachment
  zh-CN: 无法打开附件
markdown.attachments.render_error:
  en: Could not show attachments
  zh-CN: 无法显示附件
markdown.gallery.alt_text_required:
  en: "Image is missing alt text: %{name}"
  zh-CN: 图片缺少替代文本：%{name}
markdown.gallery.image_required:
  en: Include at least one image.
  zh-CN: 请至少填写一张图片。
markdown.gallery.image_unavailable:
  en: "Image attachment is missing or unsupported: %{url}"
  zh-CN: 图片附件不存在或不受支持：%{url}
markdown.gallery.local_images_only:
  en: Include only local images from this note and provide alt text for each image.
  zh-CN: 请只填写当前笔记的本地图片，并为每张图片提供替代文本。
markdown.gallery.render_error:
  en: Could not show gallery
  zh-CN: 无法显示图库
