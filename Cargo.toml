[package]
name = "locus"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/oneo-gpui-app-shell",
    "crates/oneo-gpui-markdown",
    "crates/oneo-gpui-terminal",
    "crates/oneo-gpui-ui",
]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "c8dfe26a7e554a378241186533f1aa9bd6522284" }

[dependencies]
async-channel = "2.5"
axum = "0.8"
dirs = "6"
futures = "0.3"
gpui.workspace = true
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c8dfe26a7e554a378241186533f1aa9bd6522284", features = ["font-kit", "runtime_shaders"] }
oneo-gpui-ui = { path = "crates/oneo-gpui-ui" }
oneo-gpui-app-shell = { path = "crates/oneo-gpui-app-shell" }
oneo-gpui-markdown = { path = "crates/oneo-gpui-markdown" }
oneo-gpui-terminal = { path = "crates/oneo-gpui-terminal" }
http_client = { git = "https://github.com/zed-industries/zed", rev = "c8dfe26a7e554a378241186533f1aa9bd6522284" }
image = "0.25"
libc = "0.2"
notify = "8.2"
percent-encoding = "2"
regex = "1"
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "c8dfe26a7e554a378241186533f1aa9bd6522284" }
rmcp = { version = "3", features = ["macros", "schemars", "server", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.1"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-segmentation = "1.12"

[dev-dependencies]
rmcp = { version = "3", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
raw-window-handle = "0.6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
